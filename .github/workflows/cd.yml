name: cd

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # Build the cqupt play deck and publish it to the custom-domain GitHub Pages.
  # The repo Pages source is "GitHub Actions": the site is deployed via the
  # official deploy-pages action — a push to a gh-pages branch is ignored there.
  deploy-pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps
        run: pnpm install

      # the deck reads its MapTiler key from plays/cqupt/.env (gitignored);
      # feed it from the repo secret so the deployed build has tiles
      - name: Write deck env
        run: printf 'VITE_API_KEY=%s\n' "$VITE_API_KEY" > plays/cqupt/.env
        env:
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}

      # custom domain on the repo Pages: content lives at the domain root, so
      # Slidev's default base "/" and its absolute asset paths stay correct
      - name: Build play
        run: pnpm build:cqupt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: plays/cqupt/dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

  # Publish the addon / theme / shared packages with changesets, after the deck
  # has deployed successfully — a broken main never reaches npm. Packages ship
  # as raw TS/Vue source, so there is no build step. changesets/action opens a
  # version PR when changesets are pending and releases when there are none.
  publish:
    needs: [deploy-pages]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      # npm needs registry auth for changeset publish — changesets/action@v2 does
      # not write ~/.npmrc the way v1 did, so hand the token to setup-node.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install deps
        run: pnpm install

      - name: Release
        uses: changesets/action@v2
        with:
          pr-title: "Changesets"
          commit-message: "chore: version packages [changesets]"
          version-script: pnpm run version
          publish-script: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # changesets/action@v2 creates tags/releases through the GitHub API; pushing
      # the runner's local tags is a fallback in case that path is skipped.
      - name: Push release tags
        run: git push origin --tags
