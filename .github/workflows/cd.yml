name: cd

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # Publish the addon / theme / shared packages with changesets when a version
  # bump is due. Manual only — run the workflow from the Actions tab on main.
  # Packages ship as raw TS/Vue source — no build step.
  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install deps
        run: pnpm install

      # Version via an auto PR when changesets exist, then publish + tag on the
      # merged bump; without pending changesets this is a no-op.
      - name: Release
        uses: changesets/action@v1
        with:
          branch: main
          title: "Changesets"
          commit: "chore: version packages [changesets]"
          version: pnpm run version
          publish: pnpm run release
          commitMode: "github-api"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Build the cqupt play deck and publish it to the custom-domain GitHub Pages.
  # The repo Pages source is "GitHub Actions", so the deploy goes through the
  # official deploy-pages action — a push to a gh-pages branch is ignored there.
  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps
        run: pnpm install

      # the deck reads its MapTiler key from plays/cqupt/.env (gitignored);
      # feed it from the repo secret so the deployed build has tiles
      - name: Write deck env
        run: printf 'VITE_API_KEY=%s\n' "$VITE_API_KEY" > plays/cqupt/.env
        env:
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}

      # custom domain on the repo Pages: content lives at the domain root, so
      # Slidev's default base "/" and its absolute asset paths stay correct
      - name: Build play
        run: pnpm build:cqupt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: plays/cqupt/dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
