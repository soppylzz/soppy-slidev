name: cd

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # Publish the addon / theme / shared packages with changesets when a version
  # bump is due. Packages ship as raw TS/Vue source — no build step.
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install deps
        run: pnpm install

      # Version via an auto PR when changesets exist, then publish + tag on the
      # merged bump; without pending changesets this is a no-op.
      - name: Release
        uses: changesets/action@v1
        with:
          branch: main
          title: "Changesets"
          commit: "chore: version packages [changesets]"
          version: pnpm run version
          publish: pnpm run release
          commitMode: "github-api"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Build the cqupt play deck and publish it to the custom-domain GitHub Pages.
  deploy-pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps
        run: pnpm install

      - name: Build play
        run: pnpm build:cqupt

      # custom domain on the repo Pages: deploy to the domain root, so Slidev's
      # default base "/" and its absolute asset paths stay correct
      - name: Write CNAME
        run: echo "slidev.soppylzz.com" > plays/cqupt/dist/CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: plays/cqupt/dist
          publish_branch: gh-pages
